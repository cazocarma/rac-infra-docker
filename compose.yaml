services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configurar POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configurar POSTGRES_DB}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Configurar KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/bootstrap/001-keycloak.sh:/docker-entrypoint-initdb.d/001-keycloak.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    image: flyway/flyway:11.15.0-alpine
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${MIGRATION_DB_USER:?Configurar MIGRATION_DB_USER}
      FLYWAY_PASSWORD: ${MIGRATION_DB_PASSWORD:?Configurar MIGRATION_DB_PASSWORD}
      FLYWAY_SCHEMAS: meta
      FLYWAY_DEFAULT_SCHEMA: meta
      FLYWAY_TABLE: schema_history
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_CONNECT_RETRIES: "30"
    volumes: ["./db/migrations:/flyway/sql:ro"]
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: [start, --http-enabled=true, --proxy-headers=xforwarded]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Configurar KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Configurar KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Configurar KEYCLOAK_DB_PASSWORD}
      KC_DB_SCHEMA: kc
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:?Configurar KEYCLOAK_PUBLIC_URL}
      KC_HEALTH_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:${KEYCLOAK_PORT:?Configurar KEYCLOAK_PORT}:8080"]
  identity-config:
    profiles: [tools]
    build:
      context: .
      dockerfile: tools/Dockerfile
    environment:
      RAC_ENV: ${RAC_ENV}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      COMPA_PROVISIONER_SECRET: ${COMPA_PROVISIONER_SECRET:?Configurar COMPA_PROVISIONER_SECRET}
      OIDC_WEB_REDIRECT_URI: ${OIDC_WEB_REDIRECT_URI}
      DATABASE_URL: ${DATABASE_URL}
    command: [python, configure_identity.py]
    depends_on:
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully
  backend-auth:
    image: rac-${RAC_ENV:?Configurar RAC_ENV}-auth:local
    environment:
      SERVICE_PORT: "8080"
      OIDC_ISSUER: ${OIDC_ISSUER:?Configurar OIDC_ISSUER}
      OIDC_JWKS_URL: http://keycloak:8080/realms/rentacompa/protocol/openid-connect/certs
      OIDC_AUDIENCE: rac-api
      RAC_ENV: ${RAC_ENV}
      GIN_MODE: release
    depends_on: [keycloak]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend-user:
    image: rac-${RAC_ENV}-user:local
    volumes: ["profile-photos:/var/lib/rac/photos"]
    environment:
      PROFILE_PHOTO_DIR: /var/lib/rac/photos
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?Configurar DATABASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: http://keycloak:8080/realms/rentacompa/protocol/openid-connect/certs
      OIDC_AUDIENCE: rac-api
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      COMPA_PROVISIONER_SECRET: ${COMPA_PROVISIONER_SECRET:?Configurar COMPA_PROVISIONER_SECRET}
      RAC_ENV: ${RAC_ENV}
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend-match:
    image: rac-${RAC_ENV}-match:local
    environment:
      SERVICE_NAME: rac-match-service
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_USER_URL: http://backend-user:8080
      AUTH_MOCK: "false"
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: http://keycloak:8080/realms/rentacompa/protocol/openid-connect/certs
      OIDC_AUDIENCE: rac-api
      RAC_ENV: ${RAC_ENV}
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend-chat:
    image: rac-${RAC_ENV}-chat:local
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: http://keycloak:8080/realms/rentacompa/protocol/openid-connect/certs
      OIDC_AUDIENCE: rac-api
      RAC_ENV: ${RAC_ENV}
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend-alert:
    image: rac-${RAC_ENV}-alert:local
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URL: http://keycloak:8080/realms/rentacompa/protocol/openid-connect/certs
      OIDC_AUDIENCE: rac-api
      RAC_ENV: ${RAC_ENV}
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  flutter-web:
    image: rac-${RAC_ENV}-frontend:local
    environment:
      API_BASE_URL: ${API_BASE_URL:?Configurar API_BASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: rac-web
      OIDC_REDIRECT_URI: ${OIDC_WEB_REDIRECT_URI:?Configurar OIDC_WEB_REDIRECT_URI}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost/config.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${HTTP_PORT:?Configurar HTTP_PORT}:80"]
    volumes: ["./nginx/environments.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend-auth:
        condition: service_healthy
      backend-user:
        condition: service_healthy
      backend-match:
        condition: service_healthy
      backend-chat:
        condition: service_healthy
      backend-alert:
        condition: service_healthy
      flutter-web:
        condition: service_healthy
  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Configurar RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configurar RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-events-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD, gosu, rabbitmq, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 12
  messaging-config:
    build:
      context: .
      dockerfile: tools/Dockerfile
    environment:
      RAC_ENV: ${RAC_ENV}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - messaging-publisher:/credentials/publisher
      - messaging-consumer:/credentials/consumer
    command: [python, configure_messaging.py]
    depends_on:
      rabbitmq:
        condition: service_healthy
  booking-events-relay:
    image: rac-${RAC_ENV}-match:local
    entrypoint: [/app/events-relay]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL_FILE: /run/messaging/url
    volumes: ["messaging-publisher:/run/messaging:ro"]
    restart: unless-stopped
    depends_on:
      messaging-config:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  alert-events-consumer:
    image: rac-${RAC_ENV}-alert:local
    entrypoint: [/app/consumer]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL_FILE: /run/messaging/url
    volumes: ["messaging-consumer:/run/messaging:ro"]
    restart: unless-stopped
    depends_on:
      messaging-config:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  profile-photos:
  pgdata:
  rabbitmq-data:
  rabbitmq-events-data:
  messaging-publisher:
  messaging-consumer:
