services:
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
  loki:
    profiles: [observability]
    image: grafana/loki:3.5.3
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
  docker-socket-proxy:
    profiles: [observability]
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [socket]
  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.10.2
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    environment:
      RAC_ENV: ${RAC_ENV}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    networks: [default, socket]
    depends_on: [loki, docker-socket-proxy]
  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Configurar GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Configurar GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus, loki]
volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
networks:
  socket:
    internal: true
