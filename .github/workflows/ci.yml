name: Infrastructure CI
on:
  pull_request:
    branches: [dev, qa, prd, main]
  push:
    branches: [dev, qa, prd, main]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python scripts/init_storage.py
      - run: make storage-test-persistence
      - if: always()
        run: make storage-stop
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: rac-infra-docker
      - run: python scripts/test_migrations.py
        working-directory: rac-infra-docker
      - run: python -m unittest discover -s scripts -p "test_ci_access.py"
        working-directory: rac-infra-docker
      - run: python scripts/check_configuration.py
        working-directory: rac-infra-docker
      - run: python scripts/check_backup_configuration.py
        working-directory: rac-infra-docker
      - run: python scripts/test_deployment_guards.py
        working-directory: rac-infra-docker
      - run: python -m unittest discover -s scripts -p "test_release_policy.py"
        working-directory: rac-infra-docker
  integration:
    timeout-minutes: 55
    needs: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: rac-infra-docker
      - name: Verify GitHub App configuration
        working-directory: rac-infra-docker
        env:
          RAC_CI_APP_CLIENT_ID: ${{ vars.RAC_CI_APP_CLIENT_ID }}
          RAC_CI_APP_PRIVATE_KEY: ${{ secrets.RAC_CI_APP_PRIVATE_KEY }}
        run: python scripts/check_ci_access.py --app-config
      - name: Create temporary repository read token
        id: repository-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RAC_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.RAC_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            rac-auth-service
            rac-user-service
            rac-match-service
            rac-chat-service
            rac-frontend-flutter
          permission-contents: read
          skip-token-revoke: 'false'
      - name: Read pinned companion revisions
        id: revisions
        working-directory: rac-infra-docker
        run: python scripts/ci_revisions.py
      - name: Verify repository read access
        working-directory: rac-infra-docker
        env:
          CI_REPOSITORY_TOKEN: ${{ steps.repository-token.outputs.token }}
          CI_REPOSITORY_REFS: ${{ steps.revisions.outputs.repositories }}
        run: python scripts/check_ci_access.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-auth-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-auth-service'] }}
          path: rac-auth-service
          token: ${{ steps.repository-token.outputs.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-user-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-user-service'] }}
          path: rac-user-service
          token: ${{ steps.repository-token.outputs.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-match-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-match-service'] }}
          path: rac-match-service
          token: ${{ steps.repository-token.outputs.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-frontend-flutter
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-frontend-flutter'] }}
          path: rac-frontend-flutter
          token: ${{ steps.repository-token.outputs.token }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-chat-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-chat-service'] }}
          path: rac-chat-service
          token: ${{ steps.repository-token.outputs.token }}

      - name: Database policies against companion services
        working-directory: rac-infra-docker
        run: python scripts/test_migrations.py
      - name: Prepare ephemeral DEV
        working-directory: rac-infra-docker
        run: |
          cp envs/.env.dev.example envs/.env.dev
          cp envs/realm.dev.example.json envs/realm.dev.json
          make up
          make storage-activate
          make backup-enable
      - name: S3 photo ownership and migration against disposable database
        working-directory: rac-infra-docker
        run: python scripts/test_photo_storage.py
      - name: API and PKCE integration
        working-directory: rac-infra-docker
        run: make check test-integration
      - name: Install browser test runtime
        working-directory: rac-infra-docker
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Web login and booking integration
        working-directory: rac-infra-docker
        run: python scripts/test_browser.py
      - name: Web onboarding integration
        working-directory: rac-infra-docker
        run: python scripts/test_browser_onboarding.py
      - name: Web reviews integration
        working-directory: rac-infra-docker
        run: python scripts/test_reviews_browser.py
      - name: Web private chat integration
        working-directory: rac-infra-docker
        run: python scripts/test_chat_browser.py
      - name: Identity theme integration
        working-directory: rac-infra-docker
        run: python scripts/test_identity_ui.py
      - name: Logs
        if: failure()
        working-directory: rac-infra-docker
        run: if [ -f envs/.env.dev ]; then docker compose --env-file envs/.env.dev -p rac-dev -f compose.yaml -f docker-compose.dev.yaml logs --tail=100; fi
      - name: Clean ephemeral CI containers
        if: always()
        working-directory: rac-infra-docker
        run: |
          if [ -f envs/.env.dev ]; then make down; fi
          if [ -f envs/.env.storage ]; then make storage-stop; fi
