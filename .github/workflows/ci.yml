name: Infrastructure CI
on:
  pull_request: {}
  push:
    branches: [dev, qa, prd, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: rac-infra-docker
      - name: Verify GitHub App configuration
        working-directory: rac-infra-docker
        env:
          RAC_CI_APP_CLIENT_ID: ${{ vars.RAC_CI_APP_CLIENT_ID }}
          RAC_CI_APP_PRIVATE_KEY: ${{ secrets.RAC_CI_APP_PRIVATE_KEY }}
        run: python scripts/check_ci_access.py --app-config
      - name: Create temporary repository read token
        id: repository-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RAC_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.RAC_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            rac-auth-service
            rac-user-service
            rac-match-service
            rac-chat-service
            rac-alert-service
            rac-admin-service
            rac-frontend-flutter
            rac-platform
          permission-contents: read
          skip-token-revoke: 'false'
      - name: Read pinned companion revisions
        id: revisions
        working-directory: rac-infra-docker
        run: python scripts/ci_revisions.py
      - name: Verify repository read access
        working-directory: rac-infra-docker
        env:
          CI_REPOSITORY_TOKEN: ${{ steps.repository-token.outputs.token }}
          CI_REPOSITORY_REFS: ${{ steps.revisions.outputs.repositories }}
        run: python scripts/check_ci_access.py
      - name: Verify private platform checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-platform
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-platform'] }}
          path: rac-platform
          token: ${{ steps.repository-token.outputs.token }}
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python scripts/init_storage.py
      - run: make storage-test-persistence
      - if: always()
        run: make storage-stop
  migrations:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: rac-infra-docker
      - run: python scripts/test_migrations.py
        working-directory: rac-infra-docker
      - name: Audit chain permissions and concurrency (disposable PostgreSQL)
        run: python scripts/test_audit_foundation.py
        working-directory: rac-infra-docker
      - name: Fresh and upgrade with non-superuser migration and scoped service roles
        run: python scripts/test_database_permissions.py
        working-directory: rac-infra-docker
      - name: Standing authority atomicity, concurrency and permissions
        run: python scripts/test_standing_authority.py
        working-directory: rac-infra-docker
      - name: Keycloak least privilege and prepared staff MFA
        run: python scripts/test_identity_permissions.py
        working-directory: rac-infra-docker
      - name: Persisted Keycloak upgrade and RAC theme
        run: python scripts/test_keycloak_upgrade.py
        working-directory: rac-infra-docker
      - run: python -m unittest discover -s scripts -p "test_database_credentials.py"
        working-directory: rac-infra-docker
      - run: python -m unittest discover -s scripts -p "test_backup_identity.py"
        working-directory: rac-infra-docker
      - run: python -m unittest discover -s scripts -p "test_ci_access.py"
        working-directory: rac-infra-docker
      - run: python scripts/check_configuration.py
        working-directory: rac-infra-docker
      - name: Validate Prometheus configuration and alert expressions
        working-directory: rac-infra-docker
        run: docker run --rm --entrypoint promtool --mount type=bind,source="$PWD/observability",target=/etc/prometheus,readonly prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yaml
      - run: python scripts/check_backup_configuration.py
        working-directory: rac-infra-docker
      - run: python scripts/test_deployment_guards.py
        working-directory: rac-infra-docker
      - name: Validate reviewed Actions and runner policy
        working-directory: rac-infra-docker
        run: |
          python scripts/check_actions.py
          python -m unittest discover -s scripts -p "test_actions.py"
      - run: python -m unittest discover -s scripts -p "test_build_dev.py"
        working-directory: rac-infra-docker
      - run: python -m unittest discover -s scripts -p "test_release_policy.py"
        working-directory: rac-infra-docker
  integration:
    timeout-minutes: 55
    needs: [migrations, repository-access]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: rac-infra-docker
      - name: Verify GitHub App configuration
        working-directory: rac-infra-docker
        env:
          RAC_CI_APP_CLIENT_ID: ${{ vars.RAC_CI_APP_CLIENT_ID }}
          RAC_CI_APP_PRIVATE_KEY: ${{ secrets.RAC_CI_APP_PRIVATE_KEY }}
        run: python scripts/check_ci_access.py --app-config
      - name: Create temporary repository read token
        id: repository-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RAC_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.RAC_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            rac-auth-service
            rac-user-service
            rac-match-service
            rac-chat-service
            rac-alert-service
            rac-admin-service
            rac-frontend-flutter
            rac-platform
          permission-contents: read
          skip-token-revoke: 'false'
      - name: Read pinned companion revisions
        id: revisions
        working-directory: rac-infra-docker
        run: python scripts/ci_revisions.py
      - name: Verify repository read access
        working-directory: rac-infra-docker
        env:
          CI_REPOSITORY_TOKEN: ${{ steps.repository-token.outputs.token }}
          CI_REPOSITORY_REFS: ${{ steps.revisions.outputs.repositories }}
        run: python scripts/check_ci_access.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-auth-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-auth-service'] }}
          path: rac-auth-service
          token: ${{ steps.repository-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-user-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-user-service'] }}
          path: rac-user-service
          token: ${{ steps.repository-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-match-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-match-service'] }}
          path: rac-match-service
          token: ${{ steps.repository-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-frontend-flutter
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-frontend-flutter'] }}
          path: rac-frontend-flutter
          token: ${{ steps.repository-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-chat-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-chat-service'] }}
          path: rac-chat-service
          token: ${{ steps.repository-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-alert-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-alert-service'] }}
          path: rac-alert-service
          token: ${{ steps.repository-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-admin-service
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-admin-service'] }}
          path: rac-admin-service
          token: ${{ steps.repository-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/rac-platform
          ref: ${{ fromJSON(steps.revisions.outputs.repositories)['rac-platform'] }}
          path: rac-platform
          token: ${{ steps.repository-token.outputs.token }}
      - name: Shared platform race tests at pinned revision
        run: docker run --rm --mount type=bind,source="$PWD/rac-platform",target=/src,readonly -w /src golang:1.27.2 go test -race -count=1 ./...
      - name: Database policies against companion services
        working-directory: rac-infra-docker
        run: python scripts/test_migrations.py
      - name: Transactional messaging against disposable PostgreSQL and RabbitMQ
        working-directory: rac-infra-docker
        run: python scripts/test_messaging.py
      - name: Prepare ephemeral DEV
        working-directory: rac-infra-docker
        run: |
          cp envs/.env.dev.example envs/.env.dev
          cp envs/realm.dev.example.json envs/realm.dev.json
          make up
          make storage-activate
          make backup-enable
      - name: S3 photo ownership and migration against disposable database
        working-directory: rac-infra-docker
        run: python scripts/test_photo_storage.py
      - name: API and PKCE integration
        working-directory: rac-infra-docker
        run: make check test-integration
      - name: Recover notification delivery after broker outage
        working-directory: rac-infra-docker
        run: python scripts/test_messaging_recovery.py
      - name: Install browser test runtime
        id: browser-runtime
        working-directory: rac-infra-docker
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Web login and booking integration
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        working-directory: rac-infra-docker
        run: python scripts/test_browser.py
      - name: Administrative dashboard integration
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        working-directory: rac-infra-docker
        run: python scripts/test_admin_browser.py
      - name: Time off and pending expiry integration
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        working-directory: rac-infra-docker
        run: python scripts/test_schedule_browser.py
      - name: Web notification inbox integration
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        working-directory: rac-infra-docker
        run: python scripts/test_notifications_browser.py
      - name: Web onboarding integration
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        working-directory: rac-infra-docker
        run: python scripts/test_browser_onboarding.py
      - name: Web reviews integration
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        working-directory: rac-infra-docker
        run: python scripts/test_reviews_browser.py
      - name: Web private chat integration
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        working-directory: rac-infra-docker
        run: python scripts/test_chat_browser.py
      - name: Identity theme integration
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        working-directory: rac-infra-docker
        run: python scripts/test_identity_ui.py
      - name: Preserve synthetic browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            rac-infra-docker/.local/chat-ui/*.png
            rac-infra-docker/.local/chat-ui/*.txt
            rac-infra-docker/.local/review-ui/*.png
            rac-infra-docker/.local/review-ui/*.txt
            rac-infra-docker/.local/admin-ui/*.png
            rac-infra-docker/.local/admin-ui/*.txt
            rac-infra-docker/.local/schedule-ui/*.png
      - name: Logs
        if: failure()
        working-directory: rac-infra-docker
        run: if [ -f envs/.env.dev ]; then docker compose --env-file envs/.env.dev -p rac-dev -f compose.yaml -f docker-compose.dev.yaml logs --tail=100; fi
      - name: Clean ephemeral CI containers
        if: always()
        working-directory: rac-infra-docker
        run: |
          if [ -f envs/.env.dev ]; then make down; fi
          if [ -f envs/.env.storage ]; then make storage-stop; fi
