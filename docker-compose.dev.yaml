services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  keycloak:
    command: [start-dev, --import-realm, --spi-theme-static-max-age=-1, --spi-theme-cache-themes=false, --spi-theme-cache-templates=false]
    volumes:
      - ./keycloak/themes/rac:/opt/keycloak/themes/rac:ro
      - ./envs/realm.dev.json:/opt/keycloak/data/import/realm-rentacompa.json:ro
  backend-auth:
    build: ../rac-auth-service
  backend-user:
    build: ../rac-user-service
  backend-match:
    build: ../rac-match-service
  backend-chat:
    build: ../rac-chat-service
  backend-alert:
    build: ../rac-alert-service
  backend-admin:
    build: ../rac-admin-service
  flutter-web:
    build:
      context: ../rac-frontend-flutter
  rabbitmq:
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
  pgadmin:
    image: dpage/pgadmin4:9.9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports: ["127.0.0.1:5050:80"]
    volumes: ["pgadmin-data:/var/lib/pgadmin"]
    depends_on: [postgres]
volumes:
  pgdata:
    name: ${DEV_PG_VOLUME:-rac-dev_pgdata}
  rabbitmq-data:
    name: ${DEV_RABBIT_VOLUME:-rac-dev_rabbitmq-data}
  pgadmin-data:
    name: ${DEV_PGADMIN_VOLUME:-rac-dev_pgadmin-data}
