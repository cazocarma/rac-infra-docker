networks:
  rac-net:
    driver: bridge

volumes:
  pgdata:
  minio-data:
  keycloak-data:
  rabbitmq-data:
  pgadmin_data:

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: rac-postgres
    env_file: ../.env.dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    networks: [rac-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rentacompa}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.9
    container_name: rac-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rentacompa.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks: [rac-net]
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: rac-keycloak
    command:
      - start-dev
      - --import-realm
    env_file: ../.env.dev
    depends_on: [postgres]
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-rentacompa.json:/opt/keycloak/data/import/realm-rentacompa.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [rac-net]


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rac-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [rac-net]

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: rac-minio
    env_file: ../.env.dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [rac-net]

  backend-auth:
    build: ../rac-auth-service
    container_name: rac-auth
    env_file: ../.env.dev
    depends_on: [keycloak]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rac-net]

  backend-user:
    build: ../rac-user-service
    container_name: rac-user
    env_file: ../.env.dev
    depends_on:
      postgres:
        condition: service_healthy
    networks: [rac-net]

  backend-match:
    build: ../rac-match-service
    container_name: rac-match
    env_file: ../.env.dev
    depends_on: [postgres, rabbitmq]
    networks: [rac-net]

  backend-chat:
    build: ../rac-chat-service
    container_name: rac-chat
    env_file: ../.env.dev
    depends_on: [postgres, rabbitmq]
    ports:
      - "8085:8080"
    networks: [rac-net]

  backend-payment:
    build: ../rac-payment-service
    container_name: rac-payment
    env_file: ../.env.dev
    depends_on: [postgres, rabbitmq]
    networks: [rac-net]

  backend-alert:
    build: ../rac-alert-service
    container_name: rac-alert
    env_file: ../.env.dev
    depends_on: [postgres, rabbitmq]
    networks: [rac-net]

  backend-admin:
    build: ../rac-admin-service
    container_name: rac-admin
    env_file: ../.env.dev
    depends_on: [postgres]
    networks: [rac-net]

  flutter-web:
    build:
      context: ../rac-frontend-flutter
      dockerfile: Dockerfile
    container_name: rac-frontend
    environment:
      - ENVIRONMENT=development
    depends_on:
      - backend-user
      - backend-auth
    networks: [rac-net]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: rac-nginx
    depends_on:
      - backend-auth
      - backend-user
      - backend-match
      - backend-chat
      - backend-payment
      - backend-alert
      - backend-admin
      - flutter-web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [rac-net]
