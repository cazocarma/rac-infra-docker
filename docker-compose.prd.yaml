version: "3.9"

networks:
  rac-net:
    driver: bridge

volumes:
  pgdata:
  minio-data:
  keycloak-data:
  rabbitmq-data:
  pgadmin_data:

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: rac-postgres
    env_file: ../.env.prd
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [rac-net]

  keycloak-schema:
    image: postgres:16
    container_name: rac-keycloak-schema
    env_file: ../.env.prd
    depends_on:
      - postgres
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set_in_secret_manager}
    volumes:
      - ./db/initdb/0001_keycloak_db.sql:/scripts/0001_keycloak_db.sql:ro
    entrypoint:
      - bash
      - -c
      - >
        psql -h postgres -U ${POSTGRES_USER:-postgres} -d postgres
        -f /scripts/0001_keycloak_db.sql
    networks: [rac-net]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: rac-keycloak
    command: start
    env_file: ../.env.prd
    depends_on:
      - keycloak-schema
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks: [rac-net]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rac-rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [rac-net]

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: rac-minio
    env_file: ../.env.prd
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks: [rac-net]

  backend-auth:
    image: ghcr.io/cazocarma/rac-auth-service:latest
    container_name: rac-auth
    env_file: ../.env.prd
    depends_on: [keycloak]
    networks: [rac-net]

  backend-user:
    image: ghcr.io/cazocarma/rac-user-service:latest
    container_name: rac-user
    env_file: ../.env.prd
    depends_on: [postgres]
    networks: [rac-net]

  backend-match:
    image: ghcr.io/cazocarma/rac-match-service:latest
    container_name: rac-match
    env_file: ../.env.prd
    depends_on: [postgres, rabbitmq]
    networks: [rac-net]

  backend-chat:
    image: ghcr.io/cazocarma/rac-chat-service:latest
    container_name: rac-chat
    env_file: ../.env.prd
    depends_on: [postgres, rabbitmq]
    networks: [rac-net]

  backend-payment:
    image: ghcr.io/cazocarma/rac-payment-service:latest
    container_name: rac-payment
    env_file: ../.env.prd
    depends_on: [postgres, rabbitmq]
    networks: [rac-net]

  backend-alert:
    image: ghcr.io/cazocarma/rac-alert-service:latest
    container_name: rac-alert
    env_file: ../.env.prd
    depends_on: [postgres, rabbitmq]
    networks: [rac-net]

  backend-admin:
    image: ghcr.io/cazocarma/rac-admin-service:latest
    container_name: rac-admin
    env_file: ../.env.prd
    depends_on: [postgres]
    networks: [rac-net]

  flutter-web:
    image: ghcr.io/cazocarma/rac-frontend-flutter:latest
    container_name: rac-frontend
    env_file: ../.env.prd
    networks: [rac-net]

  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: rac-nginx
    depends_on:
      - backend-auth
      - backend-user
      - backend-match
      - backend-chat
      - backend-payment
      - backend-alert
      - backend-admin
      - flutter-web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [rac-net]
