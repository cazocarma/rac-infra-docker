services:
  migrate-photos:
    profiles: [tools]
    image: rac-dev-user:local
    entrypoint: [/app/migrate-photos]
    env_file: [envs/.env.photos-s3.pending]
    environment:
      DATABASE_URL: ${USER_DB_URL:?Inicializar credenciales separadas}
      PROFILE_PHOTO_DIR: /var/lib/rac/photos
    volumes: ["profile-photos:/var/lib/rac/photos:ro"]
    networks: [default, photo-storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
networks:
  photo-storage:
    external: true
    name: rac-dev-storage_default
