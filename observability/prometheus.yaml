global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: rac-api
    static_configs:
      - targets: [backend-auth:8080]
        labels: {service: rac-auth-service}
      - targets: [backend-user:8080]
        labels: {service: rac-user-service}
      - targets: [backend-match:8080]
        labels: {service: rac-match-service}
      - targets: [backend-chat:8080]
        labels: {service: rac-chat-service}
      - targets: [backend-alert:8080]
        labels: {service: rac-alert-service}
