global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: rac-api
    static_configs:
      - targets: [backend-auth:8080]
        labels: {service: rac-auth-service}
      - targets: [backend-user:8080]
        labels: {service: rac-user-service}
      - targets: [backend-match:8080]
        labels: {service: rac-match-service}
      - targets: [backend-chat:8080]
        labels: {service: rac-chat-service}
      - targets: [booking-maintenance:8080]
        labels: {service: rac-booking-maintenance}
      - targets: [backend-admin:8080]
        labels: {service: rac-admin-service}
      - targets: [backend-alert:8080]
        labels: {service: rac-alert-service}
  - job_name: rac-messaging
    static_configs:
      - targets: [rabbitmq:15692]
        labels: {service: rabbitmq}
      - targets: [booking-events-relay:8080]
        labels: {service: booking-events-relay}
      - targets: [alert-events-consumer:8080]
        labels: {service: alert-events-consumer}
      - targets: [standing-events-relay:8080]
        labels: {service: standing-events-relay}
      - targets: [standing-match-consumer:8080]
        labels: {service: standing-match-consumer}
      - targets: [standing-alert-consumer:8080]
        labels: {service: standing-alert-consumer}
