worker_processes auto;

events { 
  worker_connections 1024; 
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # === Upstreams de microservicios ===
  upstream auth_svc    { server rac-auth:8080; }
  upstream user_svc    { server rac-user:8080; }
  upstream match_svc   { server rac-match:8080; }
  upstream chat_svc    { server rac-chat:8080; }
  upstream payment_svc { server rac-payment:8080; }
  upstream alert_svc   { server rac-alert:8080; }
  upstream admin_svc   { server rac-admin:8080; }

  # === Flutter Web ===
  upstream flutter_ui  { server rac-frontend:80; }

  server {
    listen 80;
    server_name _;

    # === FRONTEND FLUTTER WEB ===
    location / {
      proxy_pass http://flutter_ui;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Soporte SPA: redirige rutas desconocidas a index.html
      error_page 404 = /index.html;
    }

    # === BACKEND API ===
    location /api/auth/    { proxy_pass http://auth_svc/; }
    location /api/user/    { proxy_pass http://user_svc/; }
    location /api/match/   { proxy_pass http://match_svc/; }
    location /api/chat/    { proxy_pass http://chat_svc/; }
    location /api/payment/ { proxy_pass http://payment_svc/; }
    location /api/alert/   { proxy_pass http://alert_svc/; }
    location /api/admin/   { proxy_pass http://admin_svc/; }

    # === WEBSOCKETS (Chat en tiempo real) ===
    location /ws/ {
      proxy_pass http://chat_svc;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
    }

    # === Seguridad y caching ===
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Desactiva cache en desarrollo (puedes activarlo luego)
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
  }
}
