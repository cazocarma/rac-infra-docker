server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $frontend flutter-web:80;
    set $auth backend-auth:8080;
    set $users backend-user:8080;
    set $match backend-match:8080;
    set $chat backend-chat:8080;
    set $alerts backend-alert:8080;
    set $admin backend-admin:8080;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /config.json {
        add_header Cache-Control "no-store" always;
        proxy_pass http://$frontend;
    }
    location = /redirect.html {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://$frontend;
    }
    location = /metrics { return 404; }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
    }
    location = /api/auth/health { proxy_pass http://$auth/health; }
    location = /api/user/health { proxy_pass http://$users/health; }
    location /api/auth/ { proxy_pass http://$auth; }
    location = /api/user/me/photo {
        client_max_body_size 6m;
        proxy_pass http://$users;
    }
    # Legacy notification URLs terminate at the same owner, never at user-service.
    location = /api/user/notifications {
        rewrite ^ /api/alert/notifications break;
        proxy_pass http://$alerts;
    }
    location ^~ /api/user/notifications/ {
        rewrite ^/api/user/notifications/(.*)$ /api/alert/notifications/$1 break;
        proxy_pass http://$alerts;
    }
    location = /api/alert/health { proxy_pass http://$alerts/health; }
    location /api/alert/ { proxy_pass http://$alerts; }
    location = /api/admin/health { proxy_pass http://$admin/health; }
    location /api/admin/ { proxy_pass http://$admin; }
    location /api/user/ { proxy_pass http://$users; }
    location /api/match/ { proxy_pass http://$match; }
    location = /api/chat/health { proxy_pass http://$chat/health; }
    location /api/chat/ {
        proxy_read_timeout 40s;
        proxy_buffering off;
        proxy_pass http://$chat;
    }
}
