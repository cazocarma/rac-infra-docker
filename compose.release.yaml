# QA y PRD consumen artefactos ya construidos. Sin build ni etiquetas latest.
services:
  backend-auth:
    image: ${AUTH_IMAGE:?Configurar AUTH_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  backend-user:
    image: ${USER_IMAGE:?Configurar USER_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  backend-match:
    image: ${MATCH_IMAGE:?Configurar MATCH_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  backend-admin:
    image: ${ADMIN_IMAGE:?Configurar ADMIN_IMAGE con digest inmutable}
    restart: unless-stopped
  flutter-web:
    image: ${FRONTEND_IMAGE:?Configurar FRONTEND_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  backend-chat:
    image: ${CHAT_IMAGE:?Configurar CHAT_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  backend-alert:
    image: ${ALERT_IMAGE:?Configurar ALERT_IMAGE con digest inmutable}
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  keycloak:
    restart: unless-stopped
  rabbitmq:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
  booking-events-relay:
    image: ${MATCH_IMAGE:?Configurar MATCH_IMAGE}
  alert-events-consumer:
    image: ${ALERT_IMAGE:?Configurar ALERT_IMAGE}

  booking-maintenance:
    image: ${MATCH_IMAGE:?Configurar MATCH_IMAGE}
