# QA y PRD consumen artefactos ya construidos. Sin build ni etiquetas latest.
services:
  backend-auth:
    image: ${AUTH_IMAGE:?Configurar AUTH_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  backend-user:
    image: ${USER_IMAGE:?Configurar USER_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  backend-match:
    image: ${MATCH_IMAGE:?Configurar MATCH_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  flutter-web:
    image: ${FRONTEND_IMAGE:?Configurar FRONTEND_IMAGE con tag inmutable o digest}
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  keycloak:
    restart: unless-stopped
  rabbitmq:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
